name: Build Windows Package

on:
  push:
    branches:
      - chatgpt/repair-webapp-build
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-build.txt

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm RepairWebApp.spec
          if (-not (Test-Path "dist/ROVENTO-Repair-WebApp/ROVENTO-Repair-Server.exe")) {
            throw "EXE output was not created"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "RepairWebApp_Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (-not (Test-Path "installer_output/ROVENTO_Repair_WebApp_Setup.exe")) {
            throw "Installer output was not created"
          }

      - name: Create source ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item app.py,requirements.txt,requirements-build.txt,RepairWebApp.spec,RepairWebApp_Setup.iss,README_TH.md,00_BUILD_MENU.cmd,01_RUN_SOURCE.cmd,02_BUILD_EXE.cmd,03_BUILD_INSTALLER.cmd,04_BUILD_ALL.cmd,OPEN_WEB_APP.cmd -Destination package
          Copy-Item templates -Destination package/templates -Recurse
          Compress-Archive -Path package/* -DestinationPath ROVENTO_Repair_WebApp_Source.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ROVENTO_Repair_WebApp_Package
          if-no-files-found: error
          retention-days: 30
          path: |
            installer_output/ROVENTO_Repair_WebApp_Setup.exe
            dist/ROVENTO-Repair-WebApp/**
            ROVENTO_Repair_WebApp_Source.zip
